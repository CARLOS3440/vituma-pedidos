<style>
:root{--navy:#1C2340;--navy2:#2A3358;--orange:#EE5A24;--bg:#F3F4F7;--card:#fff;--text:#1C2340;--muted:#6B7088;--line:#E3E5EC;--ok:#1F9D55;--blue:#2F6FDE}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
button,input,select{font-family:inherit;font-size:14px}
input,select{border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;width:100%}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--orange);color:#fff}.btn.sec{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn.ok{background:var(--ok);color:#fff}.btn.no{background:#fff;border:1.5px solid #E7B4AE;color:#B42318}.btn.wa{background:#25D366;color:#fff}
.btn.sm{padding:6px 10px;font-size:12.5px}
.demo{background:#FFF4D6;color:#7A5600;text-align:center;font-size:12.5px;padding:6px 12px;font-weight:600}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--navy)}
#login .box{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:360px}
#login h1{font-size:26px;letter-spacing:3px;font-weight:800}#login p{color:var(--muted);font-size:13px;margin:4px 0 18px}
#login label{display:block;font-weight:700;font-size:13px;margin:10px 0 5px}
/* layout */
#app{display:none;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:220px;background:var(--navy);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px;z-index:5}
.side .logo{font-weight:800;font-size:22px;letter-spacing:3px;padding:4px 10px 2px}.side .logo small{display:block;font-size:9.5px;letter-spacing:2px;opacity:.7;font-weight:600}
.side hr{border:0;border-top:1px solid rgba(255,255,255,.12);margin:12px 0}
.side button{background:transparent;border:0;color:#fff;opacity:.78;text-align:left;padding:10px 12px;border-radius:9px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.side button.on{background:rgba(255,255,255,.1);opacity:1;box-shadow:inset 3px 0 0 var(--orange)}
.side button .n{background:var(--orange);border-radius:20px;font-size:11px;padding:1px 7px}
.side .bottom{margin-top:auto;font-size:12px;opacity:.7;padding:0 10px}
main{margin-left:220px;padding:22px 26px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
h1.t{font-size:24px;font-weight:800}
.card{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(28,35,64,.06);margin-bottom:16px}
.card h3{font-size:15px;margin-bottom:10px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.filters input{flex:1;min-width:200px}.filters select{width:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:#ECEEF3;color:var(--navy)}
.tabs .n{background:#ECEEF3;border-radius:20px;font-size:11px;padding:1px 7px;margin-left:4px}.tabs button.on .n{background:#fff}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:700;padding:10px;border-bottom:1px solid var(--line);background:#FAFBFC}
table.t td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:#FAFBFF}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
.folio{color:var(--blue);font-weight:700}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.badge.gris{background:#ECEEF3;color:#4A5068}.badge.azul{background:#E5EEFF;color:#1E4FB5}.badge.amarillo{background:#FFF4D6;color:#8A6200}
.badge.naranja{background:#FFE9DE;color:#B4400F}.badge.verde{background:#E3F6EA;color:#17803F}.badge.verde2{background:#1F9D55;color:#fff}.badge.rojo{background:#FDE7E7;color:#B42318}
.muted{color:var(--muted);font-size:12.5px}
.empty{text-align:center;color:var(--muted);padding:30px}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(15,20,40,.45);z-index:20;display:none}
.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:21;overflow:auto;transform:translateX(100%);transition:transform .25s}
.drawer.on{transform:none}
.drawer .hd{position:sticky;top:0;background:var(--navy);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.drawer .hd b{font-size:19px}.drawer .hd button{background:transparent;border:0;color:#fff;font-size:24px;cursor:pointer}
.drawer .bd{padding:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}.kv b{color:var(--muted);font-weight:600}
.pago{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.pago.pv{border-color:#F2D27A;background:#FFFBEF}
.pago img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:zoom-in;border:1px solid var(--line)}
.pago .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label.l{display:block;font-size:12.5px;font-weight:700;margin-bottom:4px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:4px}
.board{padding:12px 12px 4px;border-left:5px solid var(--orange)}
.gtitle{color:var(--orange);font-size:14px;letter-spacing:.5px;margin:2px 4px 8px}
.tscroll{overflow-x:auto}
table.prod{min-width:980px}
table.prod td{padding:6px 8px;border-right:1px solid var(--line)}
table.prod tr{cursor:pointer}table.prod tr:hover td{background:#FAFBFF}
table.prod td.tk{min-width:220px;position:relative}
table.prod td.pc{padding:0;min-width:175px}
table.prod td:nth-child(3){min-width:130px}
table.prod{min-width:1180px}
.cell{border:0;background:transparent;padding:8px;font-size:13px;cursor:pointer;width:100%}
.pillsel{font-weight:700;text-align:center;border-radius:0;height:100%;min-height:52px;appearance:none;-webkit-appearance:none}
td.venc{color:#B42318;font-weight:700}td.cerca{color:#B4400F;font-weight:700}
.crono{position:relative;background:#E6E8EF;border-radius:20px;height:22px;min-width:150px;overflow:hidden}
.crono i{position:absolute;left:0;top:0;bottom:0;background:#FF7A45}
.crono span{position:relative;font-size:11.5px;font-weight:700;display:block;text-align:center;line-height:22px;color:#1C2340}
td.mkc{width:96px;padding:4px!important}
.mkbox{position:relative;width:88px;height:56px;border-radius:6px;overflow:hidden;background:#F4F5F8;border:1px solid var(--line)}
.mkbox img{width:100%;height:100%;object-fit:contain;cursor:zoom-in}
.mkbox span{position:absolute;right:3px;bottom:3px;background:#1C2340;color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px}
.thumbs{display:flex;gap:3px;align-items:center}.thumbs img{width:28px;height:28px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}.thumbs b{font-size:11px}
.upd{position:absolute;right:8px;top:8px;font-size:11px;color:var(--muted)}
.spec{display:grid;grid-template-columns:180px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.spec:last-of-type{border-bottom:0}
.specimg{width:180px;max-height:200px;object-fit:contain;background:#F4F5F8;border-radius:8px;cursor:zoom-in}
.tallas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tallas span{border:1.5px solid var(--line);border-radius:8px;padding:4px 9px;text-align:center;font-size:13px}.tallas span b{display:block;font-size:11px;color:var(--muted)}
.tallas .tot{background:#1C2340;color:#fff;border-color:#1C2340}.tallas .tot b{color:#C9CCD6}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.file{border:1.5px solid var(--line);border-radius:10px;padding:8px;font-size:12px;display:flex;flex-direction:column;gap:6px}
.file img,.file .pdf{width:100%;height:100px;object-fit:contain;background:#F4F5F8;border-radius:6px;cursor:zoom-in}
.file .pdf{display:flex;align-items:center;justify-content:center;font-weight:800;color:#B42318}
.file a{color:var(--blue);font-weight:700}.linkdel{background:none;border:0;color:#B42318;font-weight:700;cursor:pointer;text-align:left;padding:0;font-size:12px}
@media(max-width:860px){.spec{grid-template-columns:1fr}.specimg{width:100%}}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:40;display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.zoom.on{display:flex}.zoom img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
.zoom .nbox{max-height:100%;overflow:auto;background:#fff;border-radius:8px}
/* reportes */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(28,35,64,.06)}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600}.kpi b{display:block;font-size:24px;font-weight:800;margin-top:4px}
.kpi.g b{color:var(--ok)}.kpi.r b{color:#B42318}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.bars .b{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.bars .b i{display:block;height:12px;border-radius:6px;background:var(--blue)}
.list .li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.list .li:last-child{border-bottom:0}
.up{color:var(--ok);font-weight:700}.down{color:#B42318;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:30px;font-weight:700;opacity:0;transition:.25s;z-index:50;pointer-events:none}
.toast.on{opacity:1}
.mtop{display:none}
@media(max-width:860px){
  .side{display:none}main{margin-left:0;padding:14px 14px 60px}
  .mtop{display:flex;gap:10px;align-items:center;background:var(--navy);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:6}
  .mtop b{letter-spacing:2px;font-size:18px}.mtop select{background:#2A3358;color:#fff;border-color:#3A4470}
  table.t.resp thead{display:none}
  table.t.resp tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 4px;border-bottom:1px solid var(--line)}
  table.t.resp td{border:0;padding:2px 6px}
  table.t.resp td[data-h]::before{content:attr(data-h) ": ";color:var(--muted);font-size:11.5px}
  .row3{grid-template-columns:1fr}
}
</style>
</head>

  /* ---- importe con letra ---- */
  function letras(n){
    const U = ["","UNO","DOS","TRES","CUATRO","CINCO","SEIS","SIETE","OCHO","NUEVE","DIEZ","ONCE","DOCE","TRECE","CATORCE","QUINCE","DIECISÉIS","DIECISIETE","DIECIOCHO","DIECINUEVE","VEINTE","VEINTIUNO","VEINTIDÓS","VEINTITRÉS","VEINTICUATRO","VEINTICINCO","VEINTISÉIS","VEINTISIETE","VEINTIOCHO","VEINTINUEVE"];
    const D = ["","","","TREINTA","CUARENTA","CINCUENTA","SESENTA","SETENTA","OCHENTA","NOVENTA"];
    const C = ["","CIENTO","DOSCIENTOS","TRESCIENTOS","CUATROCIENTOS","QUINIENTOS","SEISCIENTOS","SETECIENTOS","OCHOCIENTOS","NOVECIENTOS"];
    const cien = x => { if (!x) return ""; if (x === 100) return "CIEN";
      const c = Math.floor(x/100), r = x % 100; let s = C[c];
      if (r) s += (s ? " " : "") + (r < 30 ? U[r] : D[Math.floor(r/10)] + (r%10 ? " Y " + U[r%10] : ""));
      return s; };
    const un = s => s.replace(/UNO$/, "UN").replace(/VEINTIUN$/, "VEINTIÚN");
    n = Math.round((Number(n)||0) * 100) / 100;

    const mill = Math.floor(ent / 1e6), miles = Math.floor((ent % 1e6) / 1000), resto = ent % 1000;

  /* PDF de la nota (media carta: 396 × 612 pt) */
  async function notaPDF(v){
    if (!window.html2canvas || !window.jspdf){ alert("No se pudo cargar el generador de PDF. Revisa tu conexión a internet."); return; }
    const box = document.createElement("div");
    box.style.cssText = "position:fixed;left:-10000px;top:0;width:528px;background:#fff";
    box.innerHTML = notaHTML(v);
    document.body.appendChild(box);
    try {
      const canvas = await html2canvas(box.firstElementChild, { scale: 2, backgroundColor: "#ffffff" });
      const w = 396, h = Math.max(612, canvas.height * w / canvas.width);
      const pdf = new jspdf.jsPDF({ unit: "pt", format: [w, h] });
      pdf.addImage(canvas.toDataURL("image/jpeg", .92), "JPEG", 0, 0, w, canvas.height * w / canvas.width);
      pdf.save(`Nota-${v.folio}.pdf`);
    } finally { box.remove(); }
  }

  /* reduce una imagen antes de guardarla (comprobantes) */
  function reducirImagen(file, max = 1100){
    return new Promise((ok, fail) => {
      if (file.type === "application/pdf"){
        const fr = new FileReader(); fr.onload = () => ok({ tipo:"pdf", src: fr.result, nombre: file.name }); fr.onerror = fail; fr.readAsDataURL(file); return;
      }
      const fr = new FileReader();
      fr.onload = () => { const im = new Image(); im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement("canvas"); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        ok({ tipo:"img", src: c.toDataURL("image/jpeg", .8), nombre: file.name });
      }; im.onerror = fail; im.src = fr.result; };
      fr.onerror = fail; fr.readAsDataURL(file);
    });
  }

/* ---------- modificar venta ---------- */
function editarVenta(folio){
  const v = DB.ventas.find(x=>x.folio===folio);
  const ord = ["XCH","CH","M","G","XL","2XL","3XL","4XL","5XL","6XL"];
  $("#dTitle").textContent = `Modificar ${folio}`;
  $("#dBody").innerHTML = `<div class="card"><h3>Datos del cliente</h3>
      <div class="row2"><div><label class="l">Nombre</label><input id="mNom" value="${esc(v.cliente.nombre)}"></div><div><label class="l">Teléfono</label><input id="mTel" value="${esc(v.cliente.tel)}"></div></div>
      <div style="height:10px"></div><div class="row2"><div><label class="l">Trabajo</label><input id="mTra" value="${esc(v.trabajo||"")}"></div>
      <div><label class="l">Sucursal</label><select id="mSuc">${Object.keys(VT.SUCURSALES).map(k=>`<option value="${k}"${k===v.sucursal?" selected":""}>${suc(k)}</option>`).join("")}</select></div></div>
      <div style="height:10px"></div><label class="l">Descripción del bordado</label><input id="mBor" value="${esc(v.descBordado||"")}"></div>
    <div class="card"><h3>Prendas</h3>
      ${v.items.map((i,n) => `<div style="border:1.5px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px">
        <label class="l">Descripción</label><input data-md="${n}" value="${esc(i.desc)}">
        <div style="height:8px"></div>
        ${i.qty && Object.keys(i.qty).length ? `<label class="l">Piezas por talla</label><div style="display:flex;gap:6px;flex-wrap:wrap">${ord.filter(t => t in i.qty || ["CH","M","G","XL"].includes(t)).map(t=>`<label style="font-size:12px;font-weight:700;text-align:center">${t}<input data-mq="${n}" data-t="${t}" value="${i.qty[t]||0}" inputmode="numeric" style="width:58px;text-align:center"></label>`).join("")}</div>`
          : `<label class="l">Cantidad</label><input data-mc="${n}" value="${i.cant}" inputmode="numeric" style="width:90px">`}
        <div style="height:8px"></div><label class="l">Precio unitario</label><input data-mp="${n}" value="${i.punit}" inputmode="decimal" style="width:140px">
      </div>`).join("")}
      <label class="l">Anticipo requerido</label><input id="mAnt" value="${v.anticipoReq}" inputmode="decimal" style="width:160px">
      <p class="muted" style="margin-top:6px">Al cambiar piezas o precios se recalcula el total. Revisa también el anticipo requerido.</p></div>
    <div class="card"><label class="l">Motivo de la modificación *</label><input id="mMot" placeholder="Ej. El cliente agregó 2 piezas talla G">
      <div style="display:flex;gap:8px;margin-top:12px"><button class="btn pri" id="mSave">Guardar cambios</button><button class="btn sec" id="mCancel">Cancelar</button></div></div>`;
  $("#mCancel").onclick = () => abrirVenta(folio);
  $("#mSave").onclick = () => {
    const motivo = $("#mMot").value.trim(); if (!motivo) return toast("Escribe el motivo de la modificación", true);
    const tel = $("#mTel").value.replace(/\D/g,""); if (tel.length !== 10) return toast("El teléfono debe tener 10 dígitos", true);
    const antes = `Total ${money(v.total)}`;
    v.cliente.nombre = $("#mNom").value.trim() || v.cliente.nombre; v.cliente.tel = tel; v.trabajo = $("#mTra").value.trim(); v.sucursal = $("#mSuc").value; v.descBordado = $("#mBor").value.trim();
    v.items.forEach((i,n) => {
      i.desc = document.querySelector(`[data-md="${n}"]`).value.trim() || i.desc;
      const qs = document.querySelectorAll(`[data-mq="${n}"]`);
      if (qs.length){ const q = {}; qs.forEach(x => { const c = parseInt(x.value) || 0; if (c > 0) q[x.dataset.t] = c; }); i.qty = q; i.cant = Object.values(q).reduce((a,b)=>a+b,0); }
      else { const c = document.querySelector(`[data-mc="${n}"]`); i.cant = Math.max(0, parseInt(c.value) || 0); }
      i.punit = Math.round((parseFloat(document.querySelector(`[data-mp="${n}"]`).value) || 0) * 100) / 100;
      i.importe = Math.round(i.punit * i.cant * 100) / 100;
    });
    v.items = v.items.filter(i => i.cant > 0 || i.categoria === "Ponchado");
    v.total = Math.round(v.items.reduce((a,i)=>a+i.importe,0) * 100) / 100;
    v.anticipoReq = Math.min(v.total, Math.round((parseFloat($("#mAnt").value) || 0) * 100) / 100);
    const cl = DB.clientes.find(c => c.folios && c.folios.includes(folio)); if (cl){ cl.nombre = v.cliente.nombre; cl.tel = v.cliente.tel; }
    log(v, "Venta modificada", `${motivo} (${antes} → ${money(v.total)})`);
    save(); toast("Venta modificada"); abrirVenta(folio); refrescar();
  };
}

function validar(folio, id){
  const v = DB.ventas.find(x=>x.folio===folio), p = v.pagos.find(x=>x.id===id);
  p.estado = "validado"; p.validadoPor = SES.nombre; p.validadoEl = new Date().toISOString();
  log(v, "Pago validado", `${p.tipo} ${money(p.monto)} · ${p.forma}`);
  trasValidar(v); save();
  const k = VT.cuentas(v);
  toast(v.estado === "cotizacion" && k.pagado < v.anticipoReq ? `Validado. Falta ${money(v.anticipoReq - k.pagado)} para completar el anticipo` : "Pago validado ✔");
  abrirVenta(folio); refrescar();
}
/* al cubrir el anticipo: pasa a diseño, recalcula la entrega y registra el ponchado del cliente */
function trasValidar(v){
  const k = VT.cuentas(v);
  if (v.estado === "cotizacion" && k.pagado + 0.009 >= v.anticipoReq){
    const ahora = new Date().toISOString();
    v.estado = "diseno"; v.entregaMin = VT.sumarHabiles(ahora, VT.ENTREGA.min); v.entregaMax = VT.sumarHabiles(ahora, VT.ENTREGA.max);
    log(v, "Anticipo cubierto", "El pedido pasa a diseño; la entrega se cuenta desde hoy");
    asegurarOT(v);
    if (v.ponchado && v.ponchado.aplica && !v.ponchado.ya){
      const cli = DB.clientes.find(c => c.tel === v.cliente.tel);
      if (cli){ cli.logosPonchados = cli.logosPonchados || []; if (!cli.logosPonchados.some(l => l.folio === v.folio)) cli.logosPonchados.push({ folio: v.folio, logos: v.ponchado.logos, fecha: ahora }); }
    }
  }
}

$("#dClose").onclick = cerrar; $("#ov").onclick = cerrar;
function refrescar(){ DB = VT.cargar(); nav(); if (sec) PAGINAS()[sec](); }
document.addEventListener("click", e => {
  const z = $("#zoom");
  if (e.target.matches("img[data-zoom]")){ z.innerHTML = `<img src="${e.target.src}" alt="">`; z.classList.add("on"); return; }

});
document.addEventListener("keydown", e => { if (e.key === "Escape"){ $("#zoom").classList.remove("on"); cerrar(); } });

/* ---------- CLIENTES ---------- */
function pClientes(){
  const filas = DB.clientes.map(cl => {
    const vs = DB.ventas.filter(v => v.cliente.tel === cl.tel && v.estado !== "cancelada");
    const tot = vs.reduce((a,v)=>a+v.total,0), pag = vs.reduce((a,v)=>a+VT.cuentas(v).pagado,0);
    return { cl, vs, tot, pag, saldo: tot - pag, ult: vs[0] ? vs[0].fecha : cl.alta };
  }).sort((a,b) => b.tot - a.tot);

/* ---------- PEDIDO A BODEGA (concentrado de polos) ---------- */
let bSuc = "";
function concentrado(){
  const ventas = DB.ventas.filter(v => v.estado !== "cancelada" && !v.enBodega && (!bSuc || v.sucursal === bSuc) && VT.cuentas(v).pagado > 0 && v.items.some(i => i.categoria === "Playeras polo"));
  const map = new Map();
  ventas.forEach(v => v.items.filter(i => i.categoria === "Playeras polo").forEach(i => Object.entries(i.qty||{}).forEach(([t,n]) => {
    if (!n) return; const key = [i.marca, i.prenda, i.modelo, i.color, t].join("|");
    const r = map.get(key) || { marca:i.marca, prenda:i.prenda, modelo:i.modelo, color:i.color, talla:t, cant:0, folios:new Set() };
    r.cant += n; r.folios.add(v.folio); map.set(key, r);
  })));
  const ord = ["XCH","CH","M","G","XL","2XL","3XL","4XL","5XL","6XL"];
  const filas = [...map.values()].sort((a,b) => (a.marca+a.prenda+a.modelo+a.color).localeCompare(b.marca+b.prenda+b.modelo+b.color) || ord.indexOf(a.talla)-ord.indexOf(b.talla));
  return { ventas, filas };
}
function pBodega(){
  const { ventas, filas } = concentrado(), total = filas.reduce((a,r)=>a+r.cant,0);
  $("#main").innerHTML = `<div class="top"><h1 class="t">Pedido a bodega</h1>
      ${selSuc("bs", bSuc, "Ambas sucursales")}</div>

        ${filas.map(r=>`<tr><td data-h="Marca">${r.marca}</td><td>${r.prenda}</td><td data-h="Modelo">${r.modelo}</td><td data-h="Color">${r.color}</td><td data-h="Talla"><b>${r.talla}</b></td><td class="n" data-h="Cantidad"><b>${r.cant}</b></td><td class="muted" data-h="Folios">${[...r.folios].join(", ")}</td></tr>`).join("")}</tbody></table>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn sec" id="bx">⬇ Descargar Excel para bodega</button><button class="btn pri" id="bm">✔ Marcar como pedido a bodega</button></div>`
      : `<div class="empty">No hay polos pendientes por pedir.</div>`}</div>
    <div class="card"><h3>Pedidos a bodega anteriores</h3>${DB.compras.length ? `<table class="t resp"><thead><tr><th>Pedido</th><th>Fecha</th><th>Sucursal</th><th class="n">Piezas</th><th>Estado</th><th class="n">Costo</th><th>Pago</th><th></th></tr></thead><tbody>
      ${DB.compras.map(cp => `<tr><td><b>${cp.id}</b><div class="muted">${cp.folios.join(", ")}</div></td><td data-h="Fecha">${VT.fecha(cp.fecha)}</td><td data-h="Sucursal">${cp.sucursal?suc(cp.sucursal):"Ambas"}</td><td class="n" data-h="Piezas">${cp.filas.reduce((a,r)=>a+r.cant,0)}</td>
        <td><select data-ce="${cp.id}" style="width:auto"><option${cp.estado==="Solicitado"?" selected":""}>Solicitado</option><option${cp.estado==="Recibido"?" selected":""}>Recibido</option></select></td>
        <td class="n"><input data-cc="${cp.id}" value="${cp.costo||""}" placeholder="$ costo" style="width:110px;text-align:right"></td>
        <td><label style="white-space:nowrap"><input type="checkbox" data-cp="${cp.id}" style="width:auto"${cp.pagado?" checked":""}> Pagado</label></td>
        <td><button class="btn sec sm" data-cx="${cp.id}">⬇ Excel</button></td></tr>`).join("")}</tbody></table>` : `<div class="empty">Sin pedidos a bodega.</div>`}</div>`;
  if ($("#bs")) $("#bs").onchange = e => { bSuc = e.target.value; pBodega(); };
  const hoja = (fs, titulo) => excel([["Marca","Prenda","Modelo","Color","Talla","Cantidad","Folios"], ...fs.map(r=>[r.marca,r.prenda,r.modelo,r.color,r.talla,r.cant,[...r.folios].join(", ")]), [], ["","","","","TOTAL", fs.reduce((a,r)=>a+r.cant,0)]], "Pedido bodega", titulo);
  if ($("#bx")) $("#bx").onclick = () => hoja(filas, `Pedido bodega ${VT.fecha(new Date().toISOString()).replace(/\//g,"-")}${bSuc?" "+suc(bSuc):""}`);
  if ($("#bm")) $("#bm").onclick = () => {
    if (!window.confirm(`¿Marcar ${total} piezas de ${ventas.length} ventas como pedidas a bodega?`)) return;
    const id = "B" + String(DB.compras.length + 1).padStart(4, "0");
    DB.compras.unshift({ id, fecha: new Date().toISOString(), sucursal: bSuc, folios: ventas.map(v=>v.folio), filas: filas.map(r=>({...r, folios:[...r.folios]})), estado:"Solicitado", costo:null, pagado:false });
    ventas.forEach(v => { DB.ventas.find(x=>x.folio===v.folio).enBodega = id; });

  document.querySelectorAll("[data-cp]").forEach(s => s.onchange = () => { DB.compras.find(c=>c.id===s.dataset.cp).pagado = s.checked; save(); toast("Actualizado"); });
  document.querySelectorAll("[data-cx]").forEach(b => b.onclick = () => { const cp = DB.compras.find(c=>c.id===b.dataset.cx); hoja(cp.filas.map(r=>({...r, folios:new Set(r.folios)})), `Pedido bodega ${cp.id}`); });
}

/* ---------- REPORTES ---------- */
let rPer = "7", rSuc = "";
function pReportes(){
  const ahora = new Date(), ini = new Date(); ini.setHours(0,0,0,0);
  if (rPer === "7") ini.setDate(ini.getDate() - 6); else if (rPer === "30") ini.setDate(ini.getDate() - 29); else if (rPer === "mes") ini.setDate(1); else if (rPer === "todo") ini.setFullYear(2000);
  const enRango = iso => new Date(iso) >= ini && new Date(iso) <= ahora;
  const S = x => !rSuc || x.sucursal === rSuc;
  const ventas = DB.ventas.filter(v => S(v) && v.estado !== "cancelada" && enRango(v.fecha));
  const pagos = DB.ventas.filter(S).flatMap(v => v.pagos.filter(p => p.estado === "validado" && enRango(p.validadoEl || p.fecha)).map(p => ({...p, folio:v.folio, cliente:v.cliente.nombre})));
  const gastos = DB.gastos.filter(g => S(g) && enRango(g.fecha));
  const compras = DB.compras.filter(c => (!rSuc || !c.sucursal || c.sucursal === rSuc) && enRango(c.fecha));
  const vendido = ventas.reduce((a,v)=>a+v.total,0), cobrado = pagos.reduce((a,p)=>a+p.monto,0);
  const gastoT = gastos.reduce((a,g)=>a+g.monto,0), compraT = compras.reduce((a,c)=>a+(c.costo||0),0);
  const abiertas = DB.ventas.filter(v => S(v) && v.estado !== "cancelada" && VT.cuentas(v).saldo > 0.009);
  const porCobrar = abiertas.reduce((a,v)=>a+VT.cuentas(v).saldo,0);
  const aging = [["0 a 7 días",0,7],["8 a 30 días",8,30],["Más de 30 días",31,1e9]].map(([t,a,b]) => [t, abiertas.filter(v=>{const d=dias(v.fecha);return d>=a&&d<=b;}).reduce((s,v)=>s+VT.cuentas(v).saldo,0)]);
  const porPagar = DB.compras.filter(c => !c.pagado && c.costo).reduce((a,c)=>a+c.costo,0);
  const grupo = (arr, key, val) => { const m = {}; arr.forEach(x => { const k = key(x); m[k] = (m[k]||0) + val(x); }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  const items = ventas.flatMap(v => v.items.map(i => ({...i, vendedor:v.vendedor})));
  const porDia = []; for (let d = new Date(Math.max(ini, new Date(ahora - 29*864e5))); d <= ahora; d.setDate(d.getDate()+1)){ const k = d.toISOString().slice(0,10); porDia.push([k, ventas.filter(v=>v.fecha.slice(0,10)===k).reduce((a,v)=>a+v.total,0)]); }
  const bars = (rows, fmt = money) => { const mx = Math.max(1, ...rows.map(r=>r[1])); return `<div class="bars">${rows.slice(0,8).map(([k,v])=>`<div class="b"><span>${esc(k)}</span><i style="width:${Math.max(2, v/mx*100)}%"></i><b>${fmt(v)}</b></div>`).join("") || `<div class="muted">Sin datos</div>`}</div>`; };
  const mxD = Math.max(1, ...porDia.map(d=>d[1]));
  const chart = `<svg viewBox="0 0 ${porDia.length*40} 180" style="width:100%;max-width:${porDia.length*70}px;height:200px">${porDia.map(([k,v],i)=>{ const h = v/mxD*125; return `<rect x="${i*40+8}" y="${150-h}" width="24" height="${h}" rx="4" fill="#2F6FDE"/><text x="${i*40+20}" y="170" font-size="10" text-anchor="middle" fill="#6B7088">${k.slice(8)}/${k.slice(5,7)}</text>${v?`<text x="${i*40+20}" y="${144-h}" font-size="9" text-anchor="middle" fill="#1C2340">${Math.round(v/100)/10}k</text>`:""}`; }).join("")}</svg>`;
  $("#main").innerHTML = `<div class="top"><h1 class="t">Reportes</h1><div style="display:flex;gap:8px;flex-wrap:wrap">
      ${selSuc("rs", rSuc, "Ambas sucursales")}
      <select id="rp" style="width:auto">${[["hoy","Hoy"],["7","Últimos 7 días"],["30","Últimos 30 días"],["mes","Este mes"],["todo","Todo"]].map(([k,t])=>`<option value="${k}"${k===rPer?" selected":""}>${t}</option>`).join("")}</select>
      <button class="btn sec" id="xls">⬇ Descargar ventas</button></div></div>
    <div class="kpis">
      <div class="kpi"><span>Ventas</span><b>${ventas.length}</b></div>
      <div class="kpi"><span>Vendido</span><b>${money(vendido)}</b></div>
      <div class="kpi g"><span>Cobrado</span><b>${money(cobrado)}</b></div>
      <div class="kpi r"><span>Por cobrar (total)</span><b>${money(porCobrar)}</b></div>
      <div class="kpi"><span>Gastos</span><b>${money(gastoT)}</b></div>
      <div class="kpi"><span>Compras a bodega</span><b>${money(compraT)}</b></div>
      <div class="kpi ${vendido-compraT-gastoT>=0?"g":"r"}"><span>Utilidad (vendido − compras − gastos)</span><b>${money(vendido-compraT-gastoT)}</b></div>
    </div>
    <div class="card"><h3>Vendido por día</h3>${chart}</div>
    <div class="grid3">
      <div class="card"><h3>Cobrado por forma de pago</h3>${bars(grupo(pagos, p=>p.forma, p=>p.monto))}</div>
      <div class="card"><h3>Ventas por categoría</h3>${bars(grupo(items, i=>i.categoria, i=>i.importe))}</div>
      <div class="card"><h3>Prendas más vendidas (piezas)</h3>${bars(grupo(items.filter(i=>i.categoria!=="Ponchado"), i=>i.prenda.replace("Playera sublimada","Sublimada"), i=>i.cant), n=>n+" pzs")}</div>
      <div class="card"><h3>Colores más pedidos (polos)</h3>${bars(grupo(items.filter(i=>i.categoria==="Playeras polo"), i=>i.color, i=>i.cant), n=>n+" pzs")}</div>
      <div class="card"><h3>Ventas por sucursal</h3>${bars(grupo(ventas, v=>suc(v.sucursal), v=>v.total))}</div>
      <div class="card"><h3>Ventas por vendedor</h3>${bars(grupo(ventas, v=>v.vendedor, v=>v.total))}</div>
      <div class="card"><h3>Ventas por cliente</h3>${bars(grupo(ventas, v=>v.cliente.nombre, v=>v.total))}</div>
      <div class="card"><h3>Cuentas por cobrar</h3><div class="list">${aging.map(([t,v])=>`<div class="li"><span>${t}</span><b>${money(v)}</b></div>`).join("")}</div><p class="muted" style="margin-top:6px">Antigüedad contada desde la fecha de la venta.</p></div>
      <div class="card"><h3>Cuentas por pagar (bodega)</h3><div class="list"><div class="li"><span>Pedidos a bodega sin pagar</span><b>${money(porPagar)}</b></div></div><p class="muted" style="margin-top:6px">Captura el costo de cada pedido en "Pedido a bodega".</p></div>
    </div>
    <div class="card"><h3>Movimientos de dinero</h3><div class="list">${[...pagos.map(p=>({f:p.validadoEl||p.fecha, t:`${p.tipo} ${p.folio} · ${p.cliente} · ${p.forma}`, m:p.monto})), ...gastos.map(g=>({f:g.fecha, t:`Gasto: ${g.concepto}`, m:-g.monto}))].sort((a,b)=>b.f.localeCompare(a.f)).slice(0,15).map(x=>`<div class="li"><span>${esc(x.t)}<div class="muted">${VT.fechaHora(x.f)}</div></span><span class="${x.m>=0?"up":"down"}">${x.m>=0?"+":"−"}${money(Math.abs(x.m))}</span></div>`).join("") || `<div class="muted">Sin movimientos</div>`}</div></div>
    <p class="muted">Para calcular el <b>margen por prenda</b> falta capturar el costo de cada prenda (siguiente etapa).</p>`;
  $("#rp").onchange = e => { rPer = e.target.value; pReportes(); };
  if ($("#rs")) $("#rs").onchange = e => { rSuc = e.target.value; pReportes(); };
  $("#xls").onclick = () => excelVentas(ventas, "Reporte ventas");
}

  ["entregados","Entregados", ot => ot.estado === "Entregado"]
];

/* técnica de cada prenda (los pedidos de ejemplo no la traen, se deduce) */
function tecnicaItem(i){
  if (i.tecnica) return i.tecnica;
  if (i.categoria === "Playeras sublimadas") return "sublimado";
  if (/bordado/i.test(i.desc)) return "bordado";
  if (/dtf/i.test(i.desc)) return "dtf";
  return "lisa";
}
const prendas = v => v.items.filter(i => i.categoria !== "Ponchado");
const habilesHasta = iso => { let n = 0; const d = new Date(); d.setHours(0,0,0,0); const f = new Date(iso); f.setHours(0,0,0,0);
  if (f < d) return -Math.round((d - f) / 864e5); while (d < f){ d.setDate(d.getDate()+1); const w = d.getDay(); if (w && w !== 6) n++; } return n; };
const prioridadAuto = v => { const h = habilesHasta(v.entregaMax); return h <= 2 ? "Urgente" : h <= 5 ? "Alta" : h <= 9 ? "Media" : "Baja"; };

/* crea las órdenes de trabajo cuando el pedido ya tiene anticipo validado */
function asegurarOT(v){
  if (["cotizacion","cancelada"].includes(v.estado) || v.produccion) return false;
  const tecs = [...new Set(prendas(v).map(tecnicaItem))];
  const inicio = ((v.pagos || []).find(p => p.estado === "validado") || {}).validadoEl || v.fecha;
  const estadoVenta = { diseno:"En diseño", autorizacion:"Esperando autorización", produccion:"En producción", listo:"En tienda para entregar", entregado:"Entregado" }[v.estado];
  v.produccion = { ots: tecs.map((t, n) => {
    const its = prendas(v).filter(i => tecnicaItem(i) === t);
    const faltaLogo = t !== "lisa" && t !== "sublimado" && !its.some(i => (i.logos || []).length);
    return { id: v.folio + "-" + (n + 1), tecnica: t, estado: v.estado === "diseno" ? (faltaLogo ? "Falta información" : "No iniciado") : (estadoVenta || "No iniciado"),
      prioridad: null, responsable: "", inicio, archivos: [], updates: [] };
  }) };
  log(v, "Órdenes de trabajo creadas", tecs.map(t => TECNICAS[t]).join(", "));
  return true;
}
function asegurarTodas(){ let c = false; DB.ventas.forEach(v => { if (asegurarOT(v)) c = true; }); if (c) save(); }

/* el estado de la venta sigue al de sus órdenes (el menos avanzado) */
function sincronizarVenta(v){
  if (!v.produccion || v.estado === "cancelada") return;
  const orden = ["diseno","autorizacion","produccion","listo","entregado"];
  const ests = v.produccion.ots.map(o => OT_A_VENTA[o.estado] || "diseno");
  const nuevo = ests.reduce((a, b) => orden.indexOf(b) < orden.indexOf(a) ? b : a, "entregado");
  if (nuevo !== v.estado){ log(v, "Estado del pedido actualizado", `${VT.ESTADOS[v.estado].t} → ${VT.ESTADOS[nuevo].t}`); v.estado = nuevo; }
}

const pill = (t, bg, fg) => `<span class="pill" style="background:${bg};color:${fg || "#fff"}">${esc(t)}</span>`;
const pillEstado = e => { const x = OT_ESTADOS.find(s => s[0] === e) || OT_ESTADOS[1]; return pill(e, x[1], x[2]); };
const pillPrio = p => { const x = PRIORIDADES.find(s => s[0] === p) || PRIORIDADES[0]; return pill(p, x[1]); };

/* ---------- tablero ---------- */
let tab = "entrada", pQ = "";
function pProduccion(){

  DB.ventas.filter(v => v.produccion && v.estado !== "cancelada" && (!SES.sucursal || v.sucursal === SES.sucursal))

    .sort((a, b) => a.v.entregaMax.localeCompare(b.v.entregaMax));
  const mon = can("ver_montos");

  const fila = ({v, ot}) => {

    const ini = new Date(ot.inicio).getTime(), fin = new Date(v.entregaMax).getTime(), pct = Math.max(0, Math.min(100, (Date.now() - ini) / Math.max(1, fin - ini) * 100));
    const arch = [...prendas(v).filter(i => tecnicaItem(i) === ot.tecnica).flatMap(i => (i.logos || []).map(l => l.src).concat(i.mockupTipo === "diseno" && i.mockup ? [i.mockup] : [])), ...ot.archivos.filter(a => a.tipo === "img").map(a => a.src)];

    return `<tr data-ot="${ot.id}">
      <td class="mkc">${mks.length ? `<div class="mkbox"><img src="${mks[0]}" alt="Mockup" data-zoom>${mks.length > 1 ? `<span>+${mks.length-1}</span>` : ""}</div>` : `<span class="muted">—</span>`}</td>

      <td class="pc"><select class="cell pillsel" data-est="${ot.id}" style="background:${(OT_ESTADOS.find(s=>s[0]===ot.estado)||OT_ESTADOS[1])[1]};color:${(OT_ESTADOS.find(s=>s[0]===ot.estado)||OT_ESTADOS[1])[2]}">${OT_ESTADOS.map(s => `<option${s[0] === ot.estado ? " selected" : ""}>${s[0]}</option>`).join("")}</select></td>
      <td class="${h < 0 ? "venc" : h <= 2 ? "cerca" : ""}">${VT.fecha(v.entregaMax)}<div class="muted">${h < 0 ? `Vencido hace ${-h} d` : h === 0 ? "Hoy" : `${h} días háb.`}</div></td>
      <td><div class="crono"><i style="width:${pct}%"></i><span>${new Date(ot.inicio).toLocaleDateString("es-MX",{day:"numeric",month:"short"})} – ${new Date(v.entregaMax).toLocaleDateString("es-MX",{day:"numeric",month:"short"})}</span></div></td>
      <td class="pc"><select class="cell pillsel" data-pri="${ot.id}" style="background:${(PRIORIDADES.find(s=>s[0]===prio)||PRIORIDADES[0])[1]};color:#fff">${PRIORIDADES.map(s => `<option${s[0] === prio ? " selected" : ""}>${s[0]}</option>`).join("")}</select></td>
      <td>${arch.length ? `<div class="thumbs">${arch.slice(0,3).map(s => `<img src="${s}" alt="">`).join("")}${arch.length > 3 ? `<b>+${arch.length-3}</b>` : ""}</div>` : `<span class="muted">—</span>`}</td>
      ${mon ? `<td>${badge(k.pago.t, k.pago.c)}<div class="muted">${[...new Set(v.pagos.filter(p=>p.estado==="validado").map(p=>p.forma))].join(", ")}</div></td>` : ""}
    </tr>`;
  };
  const grupos = Object.keys(VT.SUCURSALES).map(s => [s, vis.filter(x => x.v.sucursal === s)]).filter(g => g[1].length);
  $("#main").innerHTML = `<div class="top"><h1 class="t">Producción</h1><div style="display:flex;gap:8px;flex-wrap:wrap">
      <input id="pq" placeholder="Buscar cliente, folio o teléfono" value="${esc(pQ)}" style="width:260px"></div></div>
    <div class="tabs">${TABLEROS.map(([k,t,f]) => `<button class="${k===tab?"on":""}" data-pt="${k}">${t}<span class="n">${filas.filter(x=>f(x.ot)).length}</span></button>`).join("")}</div>
    ${grupos.length ? grupos.map(([s, g]) => `<div class="card board"><h3 class="gtitle">ENTRADA DE ÓRDENES · ${suc(s).toUpperCase()}</h3>
      <div class="tscroll"><table class="t prod"><thead><tr><th>Mockup</th><th>Cliente / pedido</th><th>Responsable</th><th>Estado</th><th>Vencimiento</th><th>Cronograma</th><th>Prioridad</th><th>Archivos</th>${mon?"<th>Pago</th>":""}</tr></thead>
      <tbody>${g.map(fila).join("")}</tbody></table></div></div>`).join("")
    : `<div class="card"><div class="empty">No hay órdenes en este tablero.<br><span class="muted">Las órdenes aparecen solas cuando se valida el anticipo o el pago de un pedido.</span></div></div>`}`;
  document.querySelectorAll("[data-pt]").forEach(b => b.onclick = () => { tab = b.dataset.pt; pProduccion(); });
  $("#pq").oninput = e => { pQ = e.target.value; const p = e.target.selectionStart; pProduccion(); $("#pq").focus(); $("#pq").setSelectionRange(p,p); };
  const buscar = id => { for (const v of DB.ventas) for (const ot of (v.produccion ? v.produccion.ots : [])) if (ot.id === id) return { v, ot }; return {}; };
  document.querySelectorAll("[data-est]").forEach(s => { s.onclick = e => e.stopPropagation(); s.onchange = () => cambiarOT(s.dataset.est, "estado", s.value); });
  document.querySelectorAll("[data-pri]").forEach(s => { s.onclick = e => e.stopPropagation(); s.onchange = () => cambiarOT(s.dataset.pri, "prioridad", s.value); });
  document.querySelectorAll("[data-resp]").forEach(s => { s.onclick = e => e.stopPropagation(); s.onchange = () => cambiarOT(s.dataset.resp, "responsable", s.value); });
  document.querySelectorAll("tr[data-ot]").forEach(r => r.onclick = e => { if (e.target.tagName !== "SELECT" && !e.target.matches("img[data-zoom]")) abrirOT(r.dataset.ot); });
  window._buscarOT = buscar;
}
function cambiarOT(id, campo, valor, abrirDespues){
  if (!can("cambiar_estado") && campo === "estado") { toast("No tienes permiso para cambiar el estado", true); pProduccion(); return; }
  const { v, ot } = window._buscarOT(id); if (!ot) return;
  const antes = ot[campo] || (campo === "prioridad" ? prioridadAuto(v) : "—");
  ot[campo] = valor;
  log(v, `Orden ${TECNICAS[ot.tecnica]}: ${campo}`, `${antes} → ${valor || "—"}`);
  if (campo === "estado") sincronizarVenta(v);
  save(); toast("Actualizado"); nav();
  if (abrirDespues) abrirOT(id); else pProduccion();
}

      <div class="row2" style="margin-top:12px">

        <button class="btn wa sm" id="oWa">WhatsApp al cliente</button>
        ${mon && can("ver_ventas") ? `<button class="btn sec sm" id="oVenta">Ver venta y nota</button>` : ""}
        ${["Administrador","Encargado","Diseño"].includes(SES.rol) && ot.tecnica === "sublimado" ? `<a class="btn sec sm" href="${AJUSTADOR}" target="_blank" rel="noopener" style="text-decoration:none">Ajustador de tallas ↗</a>` : ""}</div></div>
    <div class="card"><h3>Especificaciones</h3>
      ${its.map(i => `<div class="spec">
        ${i.mockup ? `<img src="${i.mockup}" alt="Vista" data-zoom class="specimg">` : ""}
        <div><b>${esc(i.prenda)}</b> · ${esc(i.modelo)}${i.color ? " · " + esc(i.color) : ""}<div class="muted">${esc(i.marca || "")}</div>

/* ---------- etiqueta de paquete 9.8 × 14.8 cm (sin costos) ---------- */
function imprimirEtiquetas(v, itsOrig){
  const ord = ["XCH","CH","M","G","XL","2XL","3XL","4XL","5XL","6XL"];
  const PERS = { sublimado:"Sublimado", dtf:"DTF", bordado:"Bordado", lisa:"Sin personalizar" };
  /* un paquete por prenda + color + técnica; caballero y dama van juntos en la misma etiqueta */
  const grupos = [];
  itsOrig.forEach(i => {
    const key = [i.prod || i.prenda, i.color, tecnicaItem(i)].join("|");
    let g = grupos.find(x => x.key === key);
    if (!g){ g = { key, prenda:i.prenda, color:i.color, marca:i.marca, tec:tecnicaItem(i), filas:[], pers:[], notas:[], cant:0 }; grupos.push(g); }
    let f = g.filas.find(x => x.modelo === i.modelo);
    if (!f){ f = { modelo:i.modelo, qty:{} }; g.filas.push(f); }
    Object.entries(i.qty || {}).forEach(([t,n]) => f.qty[t] = (f.qty[t] || 0) + n);
    g.cant += i.cant;
    const pe = i.personalizacion || PERS[tecnicaItem(i)];
    if (pe && !g.pers.includes(pe)) g.pers.push(pe);
    const zn = (i.zonas || []).length && !(i.personalizacion || "").includes(i.zonas[0]) ? i.zonas.join(" · ") : "";
    if (zn && !g.pers.includes(zn)) g.pers.push(zn);
    if (i.notas){ const nt = (g.filas.length > 1 || itsOrig.filter(x => x.prod === i.prod && x.color === i.color).length > 1) ? `${i.modelo}: ${i.notas}` : i.notas; if (!g.notas.includes(nt)) g.notas.push(nt); }
  });
  const its = grupos;
  const etq = (g, n) => {
    const todas = [...new Set(g.filas.flatMap(f => Object.keys(f.qty).filter(t => f.qty[t])))];
    const tallas = todas.sort((a, b) => (ord.indexOf(a) < 0 ? 99 : ord.indexOf(a)) - (ord.indexOf(b) < 0 ? 99 : ord.indexOf(b)));
    const nc = tallas.length + (g.filas.length > 1 ? 2 : 0);
    const varios = g.filas.length > 1;
    const tabla = `<table class="${varios ? "mix" : ""} ${nc > 9 ? "xs" : nc > 7 ? "sm" : ""}"><tr>${varios ? "<th></th>" : ""}${tallas.map(t=>`<th>${t}</th>`).join("")}${varios ? "<th>Total</th>" : ""}</tr>

/* ---------- USUARIOS ---------- */
function pUsuarios(){
  const us = DB.usuarios || [];
  $("#main").innerHTML = `<div class="top"><h1 class="t">Usuarios</h1><button class="btn pri" id="uNew">＋ Nuevo usuario</button></div>
    <div class="card"><table class="t resp"><thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Sucursal</th><th>Último acceso</th><th>Estado</th></tr></thead><tbody>
      ${us.map(u => `<tr class="click" data-u="${u.id}"><td><b>${esc(u.nombre)}</b></td><td data-h="Usuario">${esc(u.usuario)}</td><td>${badge(u.rol, u.rol==="Administrador"?"naranja":"azul")}</td>
        <td data-h="Sucursal">${u.sucursal ? suc(u.sucursal) : "Ambas"}</td><td data-h="Último acceso">${u.ultimo ? VT.fechaHora(u.ultimo) : "—"}</td><td>${u.activo ? badge("Activo","verde") : badge("Desactivado","gris")}</td></tr>`).join("")}</tbody></table></div>
    <div class="card"><h3>Permisos de cada rol (puedes ajustarlos por usuario)</h3><table class="t resp"><thead><tr><th>Permiso</th>${Object.keys(ROLES).map(r=>`<th style="text-align:center">${r}</th>`).join("")}</tr></thead><tbody>
      ${PERMISOS.map(([k,t]) => `<tr><td>${t}</td>${Object.values(ROLES).map(ps=>`<td style="text-align:center">${ps.includes(k)?"✔":"—"}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  $("#uNew").onclick = () => editarUsuario(null);
  document.querySelectorAll("tr[data-u]").forEach(r => r.onclick = () => editarUsuario(r.dataset.u));
}
function editarUsuario(id){
  const u = id ? DB.usuarios.find(x => x.id === id) : { nombre:"", usuario:"", rol:"Cajera", sucursal:"", permisos:[...ROLES.Cajera], activo:true };
  const yo = id && id === SES.id;
  $("#dTitle").textContent = id ? `Usuario: ${u.nombre}` : "Nuevo usuario";
  const pintarPermisos = ps => PERMISOS.map(([k,t]) => `<label style="display:flex;gap:8px;align-items:center;padding:5px 0;font-size:13.5px"><input type="checkbox" data-p="${k}" style="width:auto"${ps.includes(k)?" checked":""}${u.rol==="Administrador"?" disabled":""}> ${t}</label>`).join("");
  $("#dBody").innerHTML = `<div class="card">
      <div class="row2"><div><label class="l">Nombre completo *</label><input id="uNom" value="${esc(u.nombre)}"></div>
        <div><label class="l">Usuario para entrar *</label><input id="uUsr" value="${esc(u.usuario)}" autocapitalize="none" placeholder="ej. patricia"></div></div>
      <div style="height:10px"></div>
      <div class="row2"><div><label class="l">${id ? "Nueva contraseña (déjala vacía para no cambiarla)" : "Contraseña * (mínimo 6 caracteres)"}</label><input id="uPas" type="password" autocomplete="new-password"></div>
        <div><label class="l">Rol</label><select id="uRol"${yo?" disabled":""}>${Object.keys(ROLES).map(r=>`<option${r===u.rol?" selected":""}>${r}</option>`).join("")}</select></div></div>
      <div style="height:10px"></div>
      <div class="row2"><div><label class="l">Sucursal</label><select id="uSuc"><option value="">Ambas sucursales</option>${Object.keys(VT.SUCURSALES).map(k=>`<option value="${k}"${k===u.sucursal?" selected":""}>${suc(k)}</option>`).join("")}</select></div>
        <div><label class="l">Estado</label><select id="uAct"${yo?" disabled":""}><option value="1"${u.activo?" selected":""}>Activo</option><option value="0"${u.activo?"":" selected"}>Desactivado</option></select></div></div></div>
    <div class="card"><h3>Permisos</h3><p class="muted" style="margin-bottom:6px">Al elegir un rol se marcan sus permisos; puedes ajustarlos para esta persona.${u.rol==="Administrador"?" El administrador tiene todos los permisos.":""}</p><div id="uPerms">${pintarPermisos(u.permisos||[])}</div></div>
    <div class="card"><div style="display:flex;gap:8px"><button class="btn pri" id="uSave">Guardar usuario</button><button class="btn sec" id="uCan">Cancelar</button></div></div>`;
  abrir();
  $("#uRol").onchange = e => { u.rol = e.target.value; $("#uPerms").innerHTML = pintarPermisos(ROLES[u.rol]); };
  $("#uCan").onclick = cerrar;
  $("#uSave").onclick = async () => {
    const nombre = $("#uNom").value.trim(), usuario = $("#uUsr").value.trim().toLowerCase().replace(/\s+/g,""), pass = $("#uPas").value;
    if (!nombre || !usuario) return toast("Escribe nombre y usuario", true);
    if (DB.usuarios.some(x => x.usuario === usuario && x.id !== id)) return toast("Ese usuario ya existe", true);
    if (!id && pass.length < 6) return toast("La contraseña debe tener al menos 6 caracteres", true);
    if (id && pass && pass.length < 6) return toast("La contraseña debe tener al menos 6 caracteres", true);
    const rol = yo ? u.rol : $("#uRol").value, activo = yo ? true : $("#uAct").value === "1";
    const admins = DB.usuarios.filter(x => x.rol === "Administrador" && x.activo && x.id !== id).length;
    if (id && DB.usuarios.find(x=>x.id===id).rol === "Administrador" && (rol !== "Administrador" || !activo) && admins === 0) return toast("Debe quedar al menos un administrador activo", true);
    const permisos = rol === "Administrador" ? [...ROLES.Administrador] : [...document.querySelectorAll("#uPerms [data-p]")].filter(x=>x.checked).map(x=>x.dataset.p);
    const datos = { nombre, usuario, rol, sucursal:$("#uSuc").value, permisos, activo };
    if (pass) datos.pass = await hash(pass);
    if (id) Object.assign(DB.usuarios.find(x=>x.id===id), datos);
    else DB.usuarios.push({ id:"U"+Date.now(), alta:new Date().toISOString(), ...datos });
    save(); if (yo){ SES = DB.usuarios.find(x=>x.id===id); }
    cerrar(); toast(id ? "Usuario actualizado" : "Usuario creado"); pUsuarios();
  };
}

/* ---------- Excel ---------- */
function excel(rows, hoja, archivo){
  if (!window.XLSX) return toast("No se pudo cargar el generador de Excel", true);
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = rows[0].map((_,i) => ({ wch: Math.min(48, Math.max(10, ...rows.map(r => String(r[i] ?? "").length + 2))) }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, hoja.slice(0,31));
  XLSX.writeFile(wb, archivo.replace(/[\\/:*?"<>|]/g,"-") + ".xlsx");
}
function excelVentas(ventas, nombre){
  excel([["Folio","Fecha","Sucursal","Cliente","Teléfono","Trabajo","Vendedor","Piezas","Total","Anticipo requerido","Pagado","Saldo","Pago","Estado","Formas de pago"],

}
