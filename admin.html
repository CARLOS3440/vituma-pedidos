<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>VITUMA · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{--navy:#1C2340;--navy2:#2A3358;--orange:#EE5A24;--bg:#F3F4F7;--card:#fff;--text:#1C2340;--muted:#6B7088;--line:#E3E5EC;--ok:#1F9D55;--blue:#2F6FDE}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
button,input,select{font-family:inherit;font-size:14px}
input,select{border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;width:100%}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--orange);color:#fff}.btn.sec{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn.ok{background:var(--ok);color:#fff}.btn.no{background:#fff;border:1.5px solid #E7B4AE;color:#B42318}.btn.wa{background:#25D366;color:#fff}
.btn.sm{padding:6px 10px;font-size:12.5px}
.demo{background:#FFF4D6;color:#7A5600;text-align:center;font-size:12.5px;padding:6px 12px;font-weight:600}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--navy)}
#login .box{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:360px}
#login h1{font-size:26px;letter-spacing:3px;font-weight:800}#login p{color:var(--muted);font-size:13px;margin:4px 0 18px}
#login label{display:block;font-weight:700;font-size:13px;margin:10px 0 5px}
/* layout */
#app{display:none;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:220px;background:var(--navy);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px;z-index:5}
.side .logo{font-weight:800;font-size:22px;letter-spacing:3px;padding:4px 10px 2px}.side .logo small{display:block;font-size:9.5px;letter-spacing:2px;opacity:.7;font-weight:600}
.side hr{border:0;border-top:1px solid rgba(255,255,255,.12);margin:12px 0}
.side button{background:transparent;border:0;color:#fff;opacity:.78;text-align:left;padding:10px 12px;border-radius:9px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.side button.on{background:rgba(255,255,255,.1);opacity:1;box-shadow:inset 3px 0 0 var(--orange)}
.side button .n{background:var(--orange);border-radius:20px;font-size:11px;padding:1px 7px}
.side .bottom{margin-top:auto;font-size:12px;opacity:.7;padding:0 10px}
main{margin-left:220px;padding:22px 26px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
h1.t{font-size:24px;font-weight:800}
.card{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(28,35,64,.06);margin-bottom:16px}
.card h3{font-size:15px;margin-bottom:10px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.filters input{flex:1;min-width:200px}.filters select{width:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:#ECEEF3;color:var(--navy)}
.tabs .n{background:#ECEEF3;border-radius:20px;font-size:11px;padding:1px 7px;margin-left:4px}.tabs button.on .n{background:#fff}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:700;padding:10px;border-bottom:1px solid var(--line);background:#FAFBFC}
table.t td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:#FAFBFF}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
.folio{color:var(--blue);font-weight:700}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.badge.gris{background:#ECEEF3;color:#4A5068}.badge.azul{background:#E5EEFF;color:#1E4FB5}.badge.amarillo{background:#FFF4D6;color:#8A6200}
.badge.naranja{background:#FFE9DE;color:#B4400F}.badge.verde{background:#E3F6EA;color:#17803F}.badge.verde2{background:#1F9D55;color:#fff}.badge.rojo{background:#FDE7E7;color:#B42318}
.muted{color:var(--muted);font-size:12.5px}
.empty{text-align:center;color:var(--muted);padding:30px}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(15,20,40,.45);z-index:20;display:none}
.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:21;overflow:auto;transform:translateX(100%);transition:transform .25s}
.drawer.on{transform:none}
.drawer .hd{position:sticky;top:0;background:var(--navy);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.drawer .hd b{font-size:19px}.drawer .hd button{background:transparent;border:0;color:#fff;font-size:24px;cursor:pointer}
.drawer .bd{padding:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}.kv b{color:var(--muted);font-weight:600}
.pago{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.pago.pv{border-color:#F2D27A;background:#FFFBEF}
.pago img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:zoom-in;border:1px solid var(--line)}
.pago .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label.l{display:block;font-size:12.5px;font-weight:700;margin-bottom:4px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:40;display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.zoom.on{display:flex}.zoom img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
.zoom .nbox{max-height:100%;overflow:auto;background:#fff;border-radius:8px}
/* reportes */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(28,35,64,.06)}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600}.kpi b{display:block;font-size:24px;font-weight:800;margin-top:4px}
.kpi.g b{color:var(--ok)}.kpi.r b{color:#B42318}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.bars .b{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.bars .b i{display:block;height:12px;border-radius:6px;background:var(--blue)}
.list .li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.list .li:last-child{border-bottom:0}
.up{color:var(--ok);font-weight:700}.down{color:#B42318;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:30px;font-weight:700;opacity:0;transition:.25s;z-index:50;pointer-events:none}
.toast.on{opacity:1}
.mtop{display:none}
@media(max-width:860px){
  .side{display:none}main{margin-left:0;padding:14px 14px 60px}
  .mtop{display:flex;gap:10px;align-items:center;background:var(--navy);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:6}
  .mtop b{letter-spacing:2px;font-size:18px}.mtop select{background:#2A3358;color:#fff;border-color:#3A4470}
  table.t.resp thead{display:none}
  table.t.resp tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 4px;border-bottom:1px solid var(--line)}
  table.t.resp td{border:0;padding:2px 6px}
  table.t.resp td[data-h]::before{content:attr(data-h) ": ";color:var(--muted);font-size:11.5px}
  .row3{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="demo">MODO MUESTRA · Los datos se guardan solo en este navegador. En la versión final se guardarán en la base de datos de VITUMA.</div>

<div id="login"><div class="box">
  <h1>VITUMA</h1><p>Panel de administración</p>
  <label>Usuario</label><input id="lu" autocomplete="username">
  <label>Contraseña</label><input id="lp" type="password" autocomplete="current-password">
  <div id="lerr" class="muted" style="color:#B42318;margin-top:8px"></div>
  <button class="btn pri" id="lbtn" style="width:100%;margin-top:14px">Entrar</button>
  <p style="margin-top:14px">Muestra: usuario <b>admin</b> · contraseña <b>vituma</b></p>
</div></div>

<div id="app">
  <div class="mtop"><b>VITUMA</b><select id="mnav" style="margin-left:auto;width:auto"></select></div>
  <aside class="side">
    <div class="logo">VITUMA<small>PANEL DE ADMINISTRACIÓN</small></div>
    <hr>
    <div id="nav" style="display:flex;flex-direction:column;gap:4px"></div>
    <div class="bottom">Sesión: <b id="who">admin</b><br><a href="#" id="logout" style="color:#fff">Cerrar sesión</a><br><br><a href="#" id="reset" style="color:#fff;opacity:.8">Borrar datos de la muestra</a></div>
  </aside>
  <main id="main"></main>
</div>

<div class="ov" id="ov"></div>
<div class="drawer" id="drawer"><div class="hd"><b id="dTitle"></b><button id="dClose" aria-label="Cerrar">×</button></div><div class="bd" id="dBody"></div></div>
<div class="zoom" id="zoom"></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   VITUMA · Funciones compartidas (app del cliente y panel)
   MODO MUESTRA: los datos se guardan en este navegador (localStorage).
   En la versión final se guardarán en la base de datos (Upstash + Vercel).
   ===================================================================== */
const VT = (() => {
  const BANCO = {
    banco: "BBVA",
    titular: "Patricia Yolanda Rodríguez Rivera",
    clabe: "012744004859384146"
  };
  const WHATSAPP_AVISOS = "526691616789";
  const SUCURSALES = {
    MAZ:   { nombre: "Mazatlán",  direccion: "Av. Santa Rosa 5800, Valle Dorado, 82163 Mazatlán, Sin." },
    ESCUI: { nombre: "Escuinapa", direccion: "Escuinapa, Sin." }
  };
  const PONCHADO = { precio: 150, gratisDesde: 12 };
  const ENTREGA = { min: 10, max: 15 }; // días hábiles
  const POLITICAS = [
    ["ANTICIPO", "Se requiere un pago inicial para comenzar las etapas de diseño, gestión de mercancía y producción. El pago del anticipo confirma automáticamente su orden."],
    ["REVISIÓN", "Es responsabilidad del cliente verificar detalladamente la información de esta nota al momento del levantamiento del pedido."],
    ["CAMBIOS Y CANCELACIONES", "Una vez confirmada la orden, no se aceptan cancelaciones, devoluciones ni modificaciones en el modelo, color o talla del producto."]
  ];
  const ESTADOS = {
    cotizacion: { t: "Esperando anticipo", c: "gris" },
    diseno:     { t: "En diseño", c: "azul" },
    autorizacion:{ t: "Esperando tu autorización", c: "amarillo" },
    produccion: { t: "En producción", c: "naranja" },
    listo:      { t: "Listo para entregar", c: "verde" },
    entregado:  { t: "Entregado", c: "verde2" }
  };
  const FORMAS = ["Transferencia", "Efectivo", "Tarjeta de débito", "Tarjeta de crédito"];

  const KEY = "vituma_demo_db";
  const vacia = () => ({ ventas: [], clientes: [], gastos: [], compras: [], folios: { MAZ: 0, ESCUI: 0 } });
  function cargar(){ try { const d = JSON.parse(localStorage.getItem(KEY) || "null"); if (d && d.ventas) return d; } catch(e){} return vacia(); }
  function guardar(d){ try { localStorage.setItem(KEY, JSON.stringify(d)); return true; } catch(e){ return false; } }

  const money = n => "$" + (Number(n)||0).toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const esc = t => String(t ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const fecha = iso => { const d = new Date(iso); return d.toLocaleDateString("es-MX", { day:"2-digit", month:"2-digit", year:"numeric" }); };
  const fechaHora = iso => { const d = new Date(iso); return d.toLocaleDateString("es-MX", { day:"2-digit", month:"short" }) + " " + d.toLocaleTimeString("es-MX", { hour:"2-digit", minute:"2-digit" }); };
  const fechaLarga = iso => new Date(iso).toLocaleDateString("es-MX", { weekday:"long", day:"numeric", month:"long" });

  function sumarHabiles(desde, n){
    const d = new Date(desde); let k = 0;
    while (k < n){ d.setDate(d.getDate() + 1); const w = d.getDay(); if (w !== 0 && w !== 6) k++; }
    return d.toISOString();
  }

  /* ---- importe con letra ---- */
  function letras(n){
    const U = ["","UNO","DOS","TRES","CUATRO","CINCO","SEIS","SIETE","OCHO","NUEVE","DIEZ","ONCE","DOCE","TRECE","CATORCE","QUINCE","DIECISÉIS","DIECISIETE","DIECIOCHO","DIECINUEVE","VEINTE","VEINTIUNO","VEINTIDÓS","VEINTITRÉS","VEINTICUATRO","VEINTICINCO","VEINTISÉIS","VEINTISIETE","VEINTIOCHO","VEINTINUEVE"];
    const D = ["","","","TREINTA","CUARENTA","CINCUENTA","SESENTA","SETENTA","OCHENTA","NOVENTA"];
    const C = ["","CIENTO","DOSCIENTOS","TRESCIENTOS","CUATROCIENTOS","QUINIENTOS","SEISCIENTOS","SETECIENTOS","OCHOCIENTOS","NOVECIENTOS"];
    const cien = x => { if (!x) return ""; if (x === 100) return "CIEN";
      const c = Math.floor(x/100), r = x % 100; let s = C[c];
      if (r) s += (s ? " " : "") + (r < 30 ? U[r] : D[Math.floor(r/10)] + (r%10 ? " Y " + U[r%10] : ""));
      return s; };
    const un = s => s.replace(/UNO$/, "UN").replace(/VEINTIUN$/, "VEINTIÚN");
    n = Math.round((Number(n)||0) * 100) / 100;
    const ent = Math.floor(n), cent = Math.round((n - ent) * 100);
    const mill = Math.floor(ent / 1e6), miles = Math.floor((ent % 1e6) / 1000), resto = ent % 1000;
    const p = [];
    if (mill) p.push(mill === 1 ? "UN MILLÓN" : un(cien(mill)) + " MILLONES");
    if (miles) p.push(miles === 1 ? "MIL" : un(cien(miles)) + " MIL");
    if (resto) p.push(cien(resto));
    const t = un(p.join(" ") || "CERO");
    return `${t} ${ent === 1 ? "PESO" : "PESOS"} ${String(cent).padStart(2,"0")}/100 M.N.`;
  }

  /* ---- cálculos de una venta ---- */
  function cuentas(v){
    const pagos = v.pagos || [];
    const pagado = pagos.filter(p => p.estado === "validado").reduce((a,p)=>a+p.monto, 0);
    const porValidar = pagos.filter(p => p.estado === "por_validar").reduce((a,p)=>a+p.monto, 0);
    const saldo = Math.max(0, Math.round((v.total - pagado) * 100) / 100);
    let pago;
    if (porValidar > 0) pago = { k:"validar", t:"Comprobante por validar", c:"amarillo" };
    else if (pagado <= 0) pago = { k:"sin", t:"Sin anticipo", c:"rojo" };
    else if (pagado + 0.009 < v.anticipoReq) pago = { k:"incompleto", t:"Anticipo incompleto", c:"rojo" };
    else if (saldo > 0) pago = { k:"saldo", t:"Saldo pendiente", c:"naranja" };
    else pago = { k:"pagada", t:"Pagada", c:"verde" };
    return { pagado, porValidar, saldo, pago, piezas: (v.items||[]).reduce((a,i)=>a+i.cant, 0) };
  }

  function siguienteFolio(db, suc){
    db.folios[suc] = (db.folios[suc] || 0) + 1;
    return suc + String(db.folios[suc]).padStart(4, "0");
  }

  /* ---- nota de venta (diseño basado en la nota de papel de VITUMA) ---- */
  const LOGO = `<svg viewBox="0 0 64 40" width="54" height="34" aria-hidden="true"><path d="M8 10 L18 2 L32 12 L46 2 L56 10 L32 36 Z" fill="none" stroke="#EE5A24" stroke-width="5" stroke-linejoin="round"/><path d="M18 2 L32 36 L46 2" fill="none" stroke="#EE5A24" stroke-width="3"/></svg>`;
  const CSS = `
  .nota{width:528px;max-width:100%;background:#fff;color:#1C2340;font-family:Montserrat,Arial,sans-serif;font-size:10px;line-height:1.3;border:1px solid #d9dbe3;margin:0 auto}
  .nota *{box-sizing:border-box}
  .nota .nh{background:#1C2340;color:#fff;padding:14px 16px 12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .nota .brand{display:flex;flex-direction:column;align-items:center;text-align:center}.nota .brand b{display:block;font-size:24px;letter-spacing:3px;font-weight:800;line-height:1}.nota .brand small{font-size:8px;letter-spacing:2px;opacity:.85}
  .nota .dir{text-align:center;font-weight:700;font-size:9.5px}.nota .dir span{display:block;font-size:7.5px;font-weight:600;margin-top:4px;opacity:.9}
  .nota .fbox{background:#fff;color:#1C2340;border-radius:6px;padding:4px 6px;margin-top:8px;font-size:7.5px;font-weight:700}
  .nota .fbox table{width:100%;border-collapse:collapse;margin-top:3px}.nota .fbox td{border:1px solid #1C2340;text-align:center;padding:3px 2px;font-size:10px;font-weight:700}
  .nota .fbox th{font-size:7px;font-weight:700;padding:1px}
  .nota .folio{background:#fff;color:#1C2340;border-radius:6px;margin-top:8px;text-align:center;padding:4px}
  .nota .folio small{display:block;font-size:9px;font-weight:800;border-bottom:1.5px solid #1C2340;padding-bottom:2px}
  .nota .folio b{display:block;font-size:20px;color:#C0392B;letter-spacing:1px;padding:4px 0}
  .nota .sec{margin:10px 12px;border:1.5px solid #1C2340;border-radius:8px;overflow:hidden}
  .nota .sec .r{display:flex;gap:6px;padding:6px 8px;border-bottom:1.5px solid #1C2340;font-size:10px}.nota .sec .r:last-child{border-bottom:0}
  .nota .sec .r b{font-weight:800;min-width:70px}
  .nota .nchk{display:inline-block;width:12px;height:12px;border:1.5px solid #1C2340;vertical-align:middle;margin:0 10px 0 4px;text-align:center;line-height:10px;font-size:10px;font-weight:800}
  .nota table.it{width:100%;border-collapse:collapse}
  .nota table.it th{background:#1C2340;color:#fff;font-size:10px;font-weight:800;padding:6px;letter-spacing:1px}
  .nota table.it td{border:1px solid #1C2340;padding:5px 6px;vertical-align:top;font-size:9.5px}
  .nota table.it td.n{text-align:right;white-space:nowrap}
  .nota .tot{display:grid;grid-template-columns:1fr auto;margin:0 12px;gap:6px}
  .nota .let{border:1.5px solid #1C2340;border-radius:8px;padding:5px 8px;font-size:8.5px}.nota .let b{display:block;font-size:8px;letter-spacing:1px}
  .nota .tt{display:flex;border:1.5px solid #1C2340;border-radius:8px;overflow:hidden;font-weight:800}.nota .tt span{background:#1C2340;color:#fff;padding:8px;font-size:12px}.nota .tt b{padding:8px 10px;font-size:13px;min-width:110px;text-align:right}
  .nota .pg{display:grid;grid-template-columns:1fr 1fr;gap:0}.nota .pg div{padding:5px 8px;border-bottom:1px solid #d0d3dc;font-size:9.5px}.nota .pg div:nth-child(odd){border-right:1px solid #d0d3dc}
  .nota .pg b{display:block;font-size:7.5px;letter-spacing:.5px;color:#4a5068}
  .nota .pg .big{font-size:12px;font-weight:800}.nota .pg .red{color:#C0392B}
  .nota .pol{margin:8px 12px 12px;font-size:7.2px;line-height:1.35}
  .nota .pol .tag{background:#1C2340;color:#fff;font-weight:800;padding:1px 5px;border-radius:3px;margin-right:4px}
  .nota .banco{margin:0 12px 10px;background:#F4F5F8;border-radius:6px;padding:6px 8px;font-size:8.5px}
  `;

  function notaHTML(v){
    const c = cuentas(v), d = new Date(v.fecha);
    const filas = v.items.map(i => `<tr><td class="n" style="text-align:center">${i.cant}</td><td>${esc(i.desc)}</td><td class="n">${money(i.punit)}</td><td class="n">${money(i.importe)}</td></tr>`).join("");

  /* PDF de la nota (media carta: 396 × 612 pt) */
  async function notaPDF(v){
    if (!window.html2canvas || !window.jspdf){ alert("No se pudo cargar el generador de PDF. Revisa tu conexión a internet."); return; }
    const box = document.createElement("div");
    box.style.cssText = "position:fixed;left:-10000px;top:0;width:528px;background:#fff";
    box.innerHTML = notaHTML(v);
    document.body.appendChild(box);
    try {
      const canvas = await html2canvas(box.firstElementChild, { scale: 2, backgroundColor: "#ffffff" });
      const w = 396, h = Math.max(612, canvas.height * w / canvas.width);
      const pdf = new jspdf.jsPDF({ unit: "pt", format: [w, h] });
      pdf.addImage(canvas.toDataURL("image/jpeg", .92), "JPEG", 0, 0, w, canvas.height * w / canvas.width);
      pdf.save(`Nota-${v.folio}.pdf`);
    } finally { box.remove(); }
  }

  /* reduce una imagen antes de guardarla (comprobantes) */
  function reducirImagen(file, max = 1100){
    return new Promise((ok, fail) => {
      if (file.type === "application/pdf"){
        const fr = new FileReader(); fr.onload = () => ok({ tipo:"pdf", src: fr.result, nombre: file.name }); fr.onerror = fail; fr.readAsDataURL(file); return;
      }
      const fr = new FileReader();
      fr.onload = () => { const im = new Image(); im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement("canvas"); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        ok({ tipo:"img", src: c.toDataURL("image/jpeg", .8), nombre: file.name });
      }; im.onerror = fail; im.src = fr.result; };
      fr.onerror = fail; fr.readAsDataURL(file);
    });
  }

           cargar, guardar, money, esc, fecha, fechaHora, fechaLarga, sumarHabiles, letras, cuentas, siguienteFolio,

    }
  }
}

/* ---------- PEDIDO A BODEGA (concentrado de polos) ---------- */
let bSuc = "";
function concentrado(){
  const ventas = DB.ventas.filter(v => !v.enBodega && (!bSuc || v.sucursal === bSuc) && VT.cuentas(v).pagado > 0 && v.items.some(i => i.categoria === "Playeras polo"));
  const map = new Map();
  ventas.forEach(v => v.items.filter(i => i.categoria === "Playeras polo").forEach(i => Object.entries(i.qty||{}).forEach(([t,n]) => {
    if (!n) return; const key = [i.marca, i.prenda, i.modelo, i.color, t].join("|");
    const r = map.get(key) || { marca:i.marca, prenda:i.prenda, modelo:i.modelo, color:i.color, talla:t, cant:0, folios:new Set() };
    r.cant += n; r.folios.add(v.folio); map.set(key, r);
  })));
  const ord = ["XCH","CH","M","G","XL","2XL","3XL","4XL"];
  const filas = [...map.values()].sort((a,b) => (a.marca+a.prenda+a.modelo+a.color).localeCompare(b.marca+b.prenda+b.modelo+b.color) || ord.indexOf(a.talla)-ord.indexOf(b.talla));
  return { ventas, filas };
}

        ${filas.map(r=>`<tr><td data-h="Marca">${r.marca}</td><td>${r.prenda}</td><td data-h="Modelo">${r.modelo}</td><td data-h="Color">${r.color}</td><td data-h="Talla"><b>${r.talla}</b></td><td class="n" data-h="Cantidad"><b>${r.cant}</b></td><td class="muted" data-h="Folios">${[...r.folios].join(", ")}</td></tr>`).join("")}</tbody></table>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn sec" id="bx">⬇ Descargar Excel para bodega</button><button class="btn pri" id="bm">✔ Marcar como pedido a bodega</button></div>`
      : `<div class="empty">No hay polos pendientes por pedir.</div>`}</div>
    <div class="card"><h3>Pedidos a bodega anteriores</h3>${DB.compras.length ? `<table class="t resp"><thead><tr><th>Pedido</th><th>Fecha</th><th>Sucursal</th><th class="n">Piezas</th><th>Estado</th><th class="n">Costo</th><th>Pago</th><th></th></tr></thead><tbody>
      ${DB.compras.map(cp => `<tr><td><b>${cp.id}</b><div class="muted">${cp.folios.join(", ")}</div></td><td data-h="Fecha">${VT.fecha(cp.fecha)}</td><td data-h="Sucursal">${cp.sucursal?suc(cp.sucursal):"Ambas"}</td><td class="n" data-h="Piezas">${cp.filas.reduce((a,r)=>a+r.cant,0)}</td>
        <td><select data-ce="${cp.id}" style="width:auto"><option${cp.estado==="Solicitado"?" selected":""}>Solicitado</option><option${cp.estado==="Recibido"?" selected":""}>Recibido</option></select></td>
        <td class="n"><input data-cc="${cp.id}" value="${cp.costo||""}" placeholder="$ costo" style="width:110px;text-align:right"></td>

  $("#bs").onchange = e => { bSuc = e.target.value; pBodega(); };
  const hoja = (fs, titulo) => excel([["Marca","Prenda","Modelo","Color","Talla","Cantidad","Folios"], ...fs.map(r=>[r.marca,r.prenda,r.modelo,r.color,r.talla,r.cant,[...r.folios].join(", ")]), [], ["","","","","TOTAL", fs.reduce((a,r)=>a+r.cant,0)]], "Pedido bodega", titulo);
  if ($("#bx")) $("#bx").onclick = () => hoja(filas, `Pedido bodega ${VT.fecha(new Date().toISOString()).replace(/\//g,"-")}${bSuc?" "+suc(bSuc):""}`);

    const id = "B" + String(DB.compras.length + 1).padStart(4, "0");

  document.querySelectorAll("[data-cx]").forEach(b => b.onclick = () => { const cp = DB.compras.find(c=>c.id===b.dataset.cx); hoja(cp.filas.map(r=>({...r, folios:new Set(r.folios)})), `Pedido bodega ${cp.id}`); });
}

/* ---------- REPORTES ---------- */
let rPer = "7", rSuc = "";
function pReportes(){
  const ahora = new Date(), ini = new Date(); ini.setHours(0,0,0,0);
  if (rPer === "7") ini.setDate(ini.getDate() - 6); else if (rPer === "30") ini.setDate(ini.getDate() - 29); else if (rPer === "mes") ini.setDate(1); else if (rPer === "todo") ini.setFullYear(2000);
  const enRango = iso => new Date(iso) >= ini && new Date(iso) <= ahora;
  const S = x => !rSuc || x.sucursal === rSuc;
  const ventas = DB.ventas.filter(v => S(v) && enRango(v.fecha));
  const pagos = DB.ventas.filter(S).flatMap(v => v.pagos.filter(p => p.estado === "validado" && enRango(p.validadoEl || p.fecha)).map(p => ({...p, folio:v.folio, cliente:v.cliente.nombre})));
  const gastos = DB.gastos.filter(g => S(g) && enRango(g.fecha));
  const compras = DB.compras.filter(c => (!rSuc || !c.sucursal || c.sucursal === rSuc) && enRango(c.fecha));
  const vendido = ventas.reduce((a,v)=>a+v.total,0), cobrado = pagos.reduce((a,p)=>a+p.monto,0);
  const gastoT = gastos.reduce((a,g)=>a+g.monto,0), compraT = compras.reduce((a,c)=>a+(c.costo||0),0);
  const abiertas = DB.ventas.filter(v => S(v) && VT.cuentas(v).saldo > 0.009);
  const porCobrar = abiertas.reduce((a,v)=>a+VT.cuentas(v).saldo,0);
  const aging = [["0 a 7 días",0,7],["8 a 30 días",8,30],["Más de 30 días",31,1e9]].map(([t,a,b]) => [t, abiertas.filter(v=>{const d=dias(v.fecha);return d>=a&&d<=b;}).reduce((s,v)=>s+VT.cuentas(v).saldo,0)]);
  const porPagar = DB.compras.filter(c => !c.pagado && c.costo).reduce((a,c)=>a+c.costo,0);
  const grupo = (arr, key, val) => { const m = {}; arr.forEach(x => { const k = key(x); m[k] = (m[k]||0) + val(x); }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  const items = ventas.flatMap(v => v.items.map(i => ({...i, vendedor:v.vendedor})));
  const porDia = []; for (let d = new Date(Math.max(ini, new Date(ahora - 29*864e5))); d <= ahora; d.setDate(d.getDate()+1)){ const k = d.toISOString().slice(0,10); porDia.push([k, ventas.filter(v=>v.fecha.slice(0,10)===k).reduce((a,v)=>a+v.total,0)]); }
  const bars = (rows, fmt = money) => { const mx = Math.max(1, ...rows.map(r=>r[1])); return `<div class="bars">${rows.slice(0,8).map(([k,v])=>`<div class="b"><span>${esc(k)}</span><i style="width:${Math.max(2, v/mx*100)}%"></i><b>${fmt(v)}</b></div>`).join("") || `<div class="muted">Sin datos</div>`}</div>`; };
  const mxD = Math.max(1, ...porDia.map(d=>d[1]));
  const chart = `<svg viewBox="0 0 ${porDia.length*40} 180" style="width:100%;max-width:${porDia.length*70}px;height:200px">${porDia.map(([k,v],i)=>{ const h = v/mxD*125; return `<rect x="${i*40+8}" y="${150-h}" width="24" height="${h}" rx="4" fill="#2F6FDE"/><text x="${i*40+20}" y="170" font-size="10" text-anchor="middle" fill="#6B7088">${k.slice(8)}/${k.slice(5,7)}</text>${v?`<text x="${i*40+20}" y="${144-h}" font-size="9" text-anchor="middle" fill="#1C2340">${Math.round(v/100)/10}k</text>`:""}`; }).join("")}</svg>`;
  $("#main").innerHTML = `<div class="top"><h1 class="t">Reportes</h1><div style="display:flex;gap:8px;flex-wrap:wrap">
      <select id="rs" style="width:auto"><option value="">Ambas sucursales</option>${Object.keys(VT.SUCURSALES).map(k=>`<option value="${k}"${k===rSuc?" selected":""}>${suc(k)}</option>`).join("")}</select>
      <select id="rp" style="width:auto">${[["hoy","Hoy"],["7","Últimos 7 días"],["30","Últimos 30 días"],["mes","Este mes"],["todo","Todo"]].map(([k,t])=>`<option value="${k}"${k===rPer?" selected":""}>${t}</option>`).join("")}</select>
      <button class="btn sec" id="xls">⬇ Descargar ventas</button></div></div>
    <div class="kpis">
      <div class="kpi"><span>Ventas</span><b>${ventas.length}</b></div>
      <div class="kpi"><span>Vendido</span><b>${money(vendido)}</b></div>
      <div class="kpi g"><span>Cobrado</span><b>${money(cobrado)}</b></div>
      <div class="kpi r"><span>Por cobrar (total)</span><b>${money(porCobrar)}</b></div>
      <div class="kpi"><span>Gastos</span><b>${money(gastoT)}</b></div>
      <div class="kpi"><span>Compras a bodega</span><b>${money(compraT)}</b></div>
      <div class="kpi ${vendido-compraT-gastoT>=0?"g":"r"}"><span>Utilidad (vendido − compras − gastos)</span><b>${money(vendido-compraT-gastoT)}</b></div>
    </div>
    <div class="card"><h3>Vendido por día</h3>${chart}</div>

      <div class="card"><h3>Ventas por vendedor</h3>${bars(grupo(ventas, v=>v.vendedor, v=>v.total))}</div>

      <div class="card"><h3>Cuentas por cobrar</h3><div class="list">${aging.map(([t,v])=>`<div class="li"><span>${t}</span><b>${money(v)}</b></div>`).join("")}</div><p class="muted" style="margin-top:6px">Antigüedad contada desde la fecha de la venta.</p></div>

/* ---------- Excel ---------- */
function excel(rows, hoja, archivo){
  if (!window.XLSX) return toast("No se pudo cargar el generador de Excel", true);
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = rows[0].map((_,i) => ({ wch: Math.min(48, Math.max(10, ...rows.map(r => String(r[i] ?? "").length + 2))) }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, hoja.slice(0,31));
  XLSX.writeFile(wb, archivo.replace(/[\\/:*?"<>|]/g,"-") + ".xlsx");
}
function excelVentas(ventas, nombre){
  excel([["Folio","Fecha","Sucursal","Cliente","Teléfono","Trabajo","Vendedor","Piezas","Total","Anticipo requerido","Pagado","Saldo","Pago","Estado","Formas de pago"],
    ...ventas.map(v => { const k = VT.cuentas(v); return [v.folio, VT.fecha(v.fecha), suc(v.sucursal), v.cliente.nombre, v.cliente.tel, v.trabajo||"", v.vendedor, k.piezas, v.total, v.anticipoReq, k.pagado, k.saldo, k.pago.t, VT.ESTADOS[v.estado].t, [...new Set(v.pagos.filter(p=>p.estado==="validado").map(p=>p.forma))].join(", ")]; })], "Ventas", `${nombre} VITUMA ${VT.fecha(new Date().toISOString()).replace(/\//g,"-")}`);
}
